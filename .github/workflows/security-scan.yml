name: Security Scan

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -pl ruoyi-admin dependency-check:check -DnvdApiKey=${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency-Check Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ruoyi-admin/target/dependency-check-report.html
          if-no-files-found: warn
